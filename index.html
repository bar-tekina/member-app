  function bindNewMemberForm(root) {
    const form = root.querySelector("#newMemberForm");
    if (!form) return;

    // ---- 本人確認書類の撮影 ----
    let idDocDraft = null; // { image } or null
    const $idType = form.querySelector("#f-id-type");
    const $idFile = form.querySelector("#f-id-file");
    const $idCapture = form.querySelector("#f-id-capture");
    const $idClear = form.querySelector("#f-id-clear");
    const $idPreviewWrap = form.querySelector("#f-id-preview-wrap");
    const $idPreview = form.querySelector("#f-id-preview");
    $idCapture.addEventListener("click", () => $idFile.click());
    $idFile.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      compressImageFile(file, 1000, 0.7, (dataUrl) => {
        $idFile.value = "";
        if (!dataUrl) { showToast("画像を読み込めませんでした"); return; }
        idDocDraft = { image: dataUrl };
        $idPreview.src = dataUrl;
        $idPreviewWrap.hidden = false;
        $idClear.hidden = false;
      });
    });
    $idClear.addEventListener("click", () => {
      idDocDraft = null;
      $idPreview.src = "";
      $idPreviewWrap.hidden = true;
      $idClear.hidden = true;
    });

    // ---- referrer picker ----
    const $refSearch = form.querySelector("#f-referrer-search");
    const $refResults = form.querySelector("#referrerResults");
    const $refChip = form.querySelector("#referrerChip");
    const $refChipName = form.querySelector("#referrerChipName");
    const $refClear = form.querySelector("#referrerClear");
    const $refId = form.querySelector("#f-referrer-id");
    const $phone = form.querySelector("#f-phone");
    const $phoneMark = form.querySelector("#phoneRequiredMark");

    function setReferrer(member) {
      $refId.value = member.id;
      $refChipName.textContent = `${member.name || "名前未設定"}さん`;
      $refChip.hidden = false;
      $refSearch.hidden = true;
      $refResults.hidden = true;
      $phone.required = true;
      $phoneMark.hidden = false;
    }
    function clearReferrer() {
      $refId.value = "";
      $refChip.hidden = true;
      $refSearch.hidden = false;
      $refSearch.value = "";
      $refResults.hidden = true;
      $phone.required = false;
      $phoneMark.hidden = true;
    }
    $refClear.addEventListener("click", clearReferrer);
    $refSearch.addEventListener("input", () => {
      const q = $refSearch.value.trim().toLowerCase();
      if (!q) { $refResults.hidden = true; $refResults.innerHTML = ""; return; }
      const allMatches = state.members.filter((m) =>
        (m.name || "").toLowerCase().includes(q) || normalizePhone(m.phone).includes(normalizePhone(q))
      );
      const matches = allMatches.slice(0, 30);
      if (!matches.length) {
        $refResults.innerHTML = `<div class="rr-empty">該当する会員が見つかりません</div>`;
      } else {
        $refResults.innerHTML = matches.map((m) => `
          <div class="rr-item" data-id="${m.id}">
            <span>${escapeHtml(m.name || "名前未設定")}</span>
            <span class="rr-sub">${escapeHtml(m.phone || "")}</span>
          </div>
        `).join("") + (allMatches.length > matches.length
          ? `<div class="rr-more">他に${allMatches.length - matches.length}件あります。続けて入力すると絞り込めます</div>`
          : "");
        $refResults.querySelectorAll(".rr-item").forEach((el) => {
          el.addEventListener("click", () => {
            const member = state.members.find((x) => x.id === el.dataset.id);
            if (member) setReferrer(member);
          });
        });
      }
      $refResults.hidden = false;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const name = (fd.get("name") || "").toString().trim();
      if (!name) return;
      const phone = (fd.get("phone") || "").toString().trim();
      const referrerId = (fd.get("referrerId") || "").toString().trim();

      // ---- 不正防止: 電話番号の重複チェック ----
      const dup = findMemberByPhone(phone);
      if (dup) {
        showToast("この電話番号はすでに登録されています(重複登録はできません)");
        return;
      }
      // ---- 不正防止: 紹介登録には電話番号を必須にする ----
      if (referrerId && !phone) {
        showToast("紹介登録には電話番号の入力が必要です");
        return;
      }
      // 本人確認書類はその場で撮影できないこともあるため任意とし、未添付でも
      // 登録できるようにしている(なりすまし・年齢詐称対策は、未添付の会員が
      // 会員一覧に「⚠️書類未登録」バッジで表示される運用でカバーし、後から
      // 編集画面で追加・差し替えできる)。

      let referredBy = null;
      if (referrerId) {
        const referrer = state.members.find((m) => m.id === referrerId);
        if (referrer) referredBy = { id: referrer.id, name: referrer.name || "" };
      }

      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "登録中…";
      const authOk = await ensureAnonymousAuth();
      if (!authOk) {
        showToast("認証に失敗しました。電波の良い場所でページを再読み込みしてから、もう一度お試しください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で登録する";
        return;
      }
      try {
        // ---- 不正防止(再チェック): 上の重複チェックは手元の端末に同期済みの
        // データだけを見ているため、ほぼ同時刻に別の端末(他のお客様のスマホなど)
        // から同じ電話番号で登録されていると見逃すことがある。保存の直前に
        // Firestore 側の最新データでもう一度確認する。
        if (phone) {
          const normPhone = normalizePhone(phone);
          const dupSnap = await state.db.collection("members").where("phone", "==", phone).limit(1).get();
          const dupSnap2 = normPhone !== phone
            ? await state.db.collection("members").where("phone", "==", normPhone).limit(1).get()
            : null;
          if (!dupSnap.empty || (dupSnap2 && !dupSnap2.empty)) {
            showToast("この電話番号はすでに登録されています(重複登録はできません)");
            submitBtn.disabled = false;
            submitBtn.textContent = "この内容で登録する";
            return;
          }
        }
        const newMemberData = {
          name,
          phone,
          email: (fd.get("email") || "").toString().trim(),
          line: (fd.get("line") || "").toString().trim(),
          instagram: (fd.get("instagram") || "").toString().trim(),
          address: (fd.get("address") || "").toString().trim(),
          birthYear: fd.get("birthYear") ? Number(fd.get("birthYear")) : null,
          birthMonth: fd.get("birthMonth") ? Number(fd.get("birthMonth")) : null,
          birthDay: fd.get("birthDay") ? Number(fd.get("birthDay")) : null,
          memo: (fd.get("memo") || "").toString().trim(),
          points: referredBy ? REFERRAL_WELCOME_POINTS : 0,
          totalPointsEarned: referredBy ? REFERRAL_WELCOME_POINTS : 0,
          visitCount: 0,
          totalSpend: 0,
          visits: [],
          referredBy,
          referralBonusGranted: false,
          referralLog: [],
          createdAt: new Date().toISOString(),
          idDocument: idDocDraft ? { type: $idType.value || "other", image: idDocDraft.image, uploadedAt: new Date().toISOString() } : null,
        };
        const ref = await withAuthRetry(() => state.db.collection("members").add(newMemberData));
        showToast(referredBy ? `「${name}」さんを登録しました(紹介特典+${REFERRAL_WELCOME_POINTS})` : `「${name}」さんを登録しました`);
        if (state.publicJoinMode) {
          // お客様ご自身のスマホでの登録(#join)の場合は、いつでも開き直せる
          // 「会員証」専用ページ(#card<id>)にそのまま移動する。URLを
          // ブックマークやホーム画面に追加しておけば、次回以降もすぐ開ける。
          state.publicJoinMode = false;
          state.publicCardMode = true;
          state.publicCardMemberId = ref.id;
          state.publicCardMemberFallback = { id: ref.id, ...newMemberData };
          try { history.replaceState(null, "", location.pathname + location.search + "#card" + ref.id); } catch (err) {}
          render();
        } else if (state.kioskMode) {
          // オーナー・スタッフが自分の端末をお客様に見せて登録してもらった場合
          // (キオスクモード)。URLは変えず、画面だけ会員証表示に切り替える。
          // 「オーナー画面に戻る」を押すまでオーナー専用の内容は表示されない。
          state.kioskCardMemberId = ref.id;
          state.kioskCardMemberFallback = { id: ref.id, ...newMemberData };
          render();
        } else {
          document.querySelector('nav.tabs button[data-tab="list"]').click();
          // 登録直後に、この会員専用の入店QRをその場で発行して見せる(スタッフ操作時)
          openMemberEntryQRSheet({ id: ref.id, ...newMemberData });
        }
      } catch (err) {
        showToast("登録に失敗しました。もう一度お試しください。" + (err && err.message ? "(" + err.message + ")" : "") + " [" + authDebugInfo() + "]");
        submitBtn.disabled = false;
        submitBtn.textContent = "この内容で登録する";
      }
    });
  }

  // ---------- 売上(オーナー専用) ----------
  function todayDateStr() {
    return new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
  }
  function allTransactions() {
    // 会員の来店記録は visitLog(全件保存)を正として集計する。
    // member.visits は直近15件しか保存しないため、来店頻度が高い会員ほど
    // 古い記録がそちらには残らない(detailシートでの表示専用として使う)。
    const list = [];
    state.guestSales.forEach((g) => {
      list.push({
        date: g.date || "",
        amount: Number(g.amount) || 0,
        label: "一般客(非会員)",
        sub: g.note || "",
        createdAt: g.createdAt || "",
        staffName: g.staffName || "",
      });
    });
    state.visitLog.forEach((v) => {
      list.push({
        date: v.date || "",
        amount: Number(v.amount) || 0,
        label: v.memberName || "名前未設定",
        sub: v.note || "",
        createdAt: v.createdAt || "",
        staffName: v.staffName || "",
      });
    });
    return list;
  }
  // スタッフ別実績(対応スタッフを選んで記録された会計のみを集計)。
  // 「選択しない」のまま記録された会計は対象外のため、合計がsalesTabの総額と
  // 一致しなくてよい(あくまでスタッフ別の目安)。
  function staffPerformance() {
    const txns = allTransactions();
    const byStaff = {};
    txns.forEach((t) => {
      const name = (t.staffName || "").trim();
      if (!name) return;
      if (!byStaff[name]) byStaff[name] = { name, count: 0, amount: 0 };
      byStaff[name].count += 1;
      byStaff[name].amount += t.amount;
    });
    return Object.values(byStaff).sort((a, b) => b.amount - a.amount);
  }
  // 今月のスタッフ別勤務時間(目安)。出勤→退勤の記録を時系列でペアにして、
  // その間の時間を合計する。退勤を忘れた等でペアにならない「出勤」記録は
  // 集計に含めない(あくまで目安の集計であることをヒントで明記する)。
  function staffAttendanceHours() {
    const now = new Date();
    const monthKey = now.getFullYear() + "-" + pad2(now.getMonth() + 1);
    const sorted = state.attendance.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const openIn = {};
    const byStaff = {};
    sorted.forEach((a) => {
      const name = (a.staffName || "").trim();
      if (!name) return;
      if (a.type === "in") {
        openIn[name] = a.ts;
      } else if (a.type === "out" && openIn[name] != null) {
        const inTs = openIn[name];
        delete openIn[name];
        if (!a.ts || a.ts <= inTs) return;
        const d = new Date(inTs);
        const key = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
        if (key !== monthKey) return;
        const minutes = Math.round((a.ts - inTs) / 60000);
        if (!byStaff[name]) byStaff[name] = { name, minutes: 0, shifts: 0 };
        byStaff[name].minutes += minutes;
        byStaff[name].shifts += 1;
      }
    });
    return Object.values(byStaff).sort((a, b) => b.minutes - a.minutes);
  }
  function minutesToHm(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h + "時間" + (m ? m + "分" : "");

  // 曜日×時間帯ヒートマップ用。createdAt(ISO文字列)から、端末のローカル時刻での
  // 曜日・時間を取り出す。dateフィールドは日付のみで時刻を持たないため、
  // 時間帯の集計にはcreatedAtを使う(古いデータでcreatedAtが無いものは対象外)。
  const HEATMAP_HOUR_BINS = [
    { label: "0-4時", from: 0, to: 4 },
    { label: "4-8時", from: 4, to: 8 },
    { label: "8-12時", from: 8, to: 12 },
    { label: "12-16時", from: 12, to: 16 },
    { label: "16-20時", from: 16, to: 20 },
    { label: "20-24時", from: 20, to: 24 },
  ];
  function hourBinIndexOf(createdAt) {
    if (!createdAt) return null;
    const d = new Date(createdAt);
    if (isNaN(d.getTime())) return null;
    const hour = d.getHours();
    for (let i = 0; i < HEATMAP_HOUR_BINS.length; i++) {
      if (hour >= HEATMAP_HOUR_BINS[i].from && hour < HEATMAP_HOUR_BINS[i].to) return i;
    }
    return null;
  }
  function weekdayHourHeatmap(txns) {
    // grid[weekday(0-6)][hourBin] = { count, amount }
    const grid = Array.from({ length: 7 }, () => HEATMAP_HOUR_BINS.map(() => ({ count: 0, amount: 0 })));
    txns.forEach((t) => {
      if (!t.createdAt) return;
      const d = new Date(t.createdAt);
      if (isNaN(d.getTime())) return;
      const wd = d.getDay();
      const bin = hourBinIndexOf(t.createdAt);
      if (bin == null) return;
      grid[wd][bin].count += 1;
      grid[wd][bin].amount += t.amount;
    });
    return grid;
  }

  const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];

  function monthKeyOf(dateStr) {
    return (dateStr || "").slice(0, 7); // "YYYY/MM"
  }
  function lastNMonthKeys(n) {
    const keys = [];
    const now = new Date();
    for (let i = n - 1; i >= 0; i--) {
      const dt = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const mo = String(dt.getMonth() + 1).padStart(2, "0");
      keys.push(`${dt.getFullYear()}/${mo}`);
    }
    return keys;
  }
  function weekdayOf(dateStr) {
    if (!dateStr) return null;
    const parsed = new Date(dateStr);
    return isNaN(parsed.getTime()) ? null : parsed.getDay();
  }
  function yearKeyOf(dateStr) {
    return (dateStr || "").slice(0, 4); // "YYYY"
  }
  function lastNYearKeys(n) {
    const keys = [];
    const thisYear = new Date().getFullYear();
    for (let i = n - 1; i >= 0; i--) keys.push(String(thisYear - i));
    return keys;
  }
  // 今日が「その年の何日目か」を基準に、今年の年初〜今日 と 去年の年初〜同じ日数 を比較する
  // (1年の途中で比べても公平になるよう、同じ期間同士で比較する)
  function dayOfYear(d) {
    const start = new Date(d.getFullYear(), 0, 1);
    return Math.floor((d - start) / (24 * 60 * 60 * 1000)) + 1;
  }
  function yearToDateTotal(txns, year, uptoDayOfYear) {
    let total = 0;
    txns.forEach((t) => {
      if (yearKeyOf(t.date) !== String(year)) return;
      const d = new Date(t.date);
      if (isNaN(d.getTime())) return;
      if (dayOfYear(d) <= uptoDayOfYear) total += t.amount;
    });
    return total;
  }

  function dormantMembers() {

  // ---------- 予約カレンダー ----------
  // お客様は #reserve の公開フォームから「日付・時間・人数」を送信して予約依頼ができる。
  // 誰でも予約可能(会員登録不要・名前と電話番号のみ)。送信直後は status:"pending"
  // (仮予約)で、スタッフ・オーナーどちらでも「予約」タブで内容を確認してから
  // 「承認する」を押すと status:"confirmed"(予約確定)になる。予約数の上限は設けていない。
  function pad2(n) { return String(n).padStart(2, "0"); }
  // 注意: この関数は予約カレンダー専用で、ISO形式("YYYY-MM-DD")の日付文字列を
  // 返す。売上集計で使っているtodayDateStr()(ja-JPロケールの"YYYY/MM/DD"形式)
  // とは別物。過去に同名の関数が2つ定義されており、後から読み込まれる方が
  // 常に勝ってしまう(JavaScriptの関数宣言は同スコープ内で同名なら後のものが
  // 上書きする)ため、売上タブの「本日の売上」「今月の累計」が日付の形式不一致
  // (ハイフンとスラッシュ)で常に¥0になってしまう不具合があった。名前を分けて
  // この不具合を修正している。
  function todayDateStrISO() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  }
  function currentMonthStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  }
  function addMonths(monthStr, delta) {
    const [y, m] = monthStr.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
  }
  function calMonthLabel(monthStr) {
    const [y, m] = monthStr.split("-").map(Number);
    return `${y}年${m}月`;
  }
  function formatDateJp(dateStr) {
    if (!dateStr) return "";
    const [y, m, d] = dateStr.split("-").map(Number);
    const wd = WEEKDAY_LABELS[new Date(y, m - 1, d).getDay()];
    return `${y}年${m}月${d}日(${wd})`;
  }
  // カレンダーのマス目を作る。月初の曜日分だけ先頭を空セルにして、7の倍数になるまで末尾も空セルで埋める。
  function buildMonthGrid(monthStr) {
    const [y, m] = monthStr.split("-").map(Number);
    const firstWeekday = new Date(y, m - 1, 1).getDay();
    const daysInMonth = new Date(y, m, 0).getDate();
    const cells = [];
    for (let i = 0; i < firstWeekday; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push({ dateStr: `${y}-${pad2(m)}-${pad2(d)}`, day: d });
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }
  function reservationStatusLabel(status) {
    if (status === "confirmed") return "予約確定";
    if (status === "cancelled") return "キャンセル";
    return "確認待ち";
  }

  function bindReservationForm(root) {
    const $prev = root.querySelector("#calPrevMonth");
    const $next = root.querySelector("#calNextMonth");
    if ($prev) $prev.addEventListener("click", () => { state.reserveFormMonth = addMonths(state.reserveFormMonth, -1); render(); });
    if ($next) $next.addEventListener("click", () => { state.reserveFormMonth = addMonths(state.reserveFormMonth, 1); render(); });
    root.querySelectorAll(".cal-cell[data-date]").forEach((btn) => {
      btn.addEventListener("click", () => { state.reserveFormDate = btn.dataset.date; render(); });
    });

    const form = root.querySelector("#reservationForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.reserveFormDate) { showToast("来店日をカレンダーから選んでください"); return; }
      if (!state.db) { showToast("通信環境をご確認のうえ、もう一度お試しください。"); return; }
      const fd = new FormData(form);
      const time = (fd.get("time") || "").toString();
      const partySize = Number(fd.get("partySize")) || 1;
      const name = (fd.get("name") || "").toString().trim();
      const phone = (fd.get("phone") || "").toString().trim();
      const memo = (fd.get("memo") || "").toString().trim();
      if (!name || !phone) { showToast("お名前と電話番号を入力してください"); return; }
      const submitBtn = form.querySelector("button[type=submit]");
      submitBtn.disabled = true;
      submitBtn.textContent = "送信中…";
      const authOk = await ensureAnonymousAuth();
      if (!authOk) {
        showToast("認証に失敗しました。電波の良い場所でページを再読み込みしてから、もう一度お試しください。");
        submitBtn.disabled = false;
        submitBtn.textContent = "予約を送信する";
        return;
      }
      try {
        await withAuthRetry(() => state.db.collection("reservations").add({
          date: state.reserveFormDate,
          time,
          partySize,
          name,
          phone,
          memo,
          status: "pending",
          createdAt: new Date().toISOString(),
        }));
        $main.innerHTML = `
          <div class="empty">
            <div class="glyph">📅</div>
            <p>ご予約を受け付けました！<br>店舗からの確定のご連絡をお待ちください。</p>
          </div>
        `;
      } catch (err) {
        showToast("送信に失敗しました。もう一度お試しください。" + (err && err.message ? "(" + err.message + ")" : "") + " [" + authDebugInfo() + "]");
        submitBtn.disabled = false;
        submitBtn.textContent = "予約を送信する";
      }
    });
  }

              </div>
              <div class="res-name">${escapeHtml(r.name || "名前未設定")}様・${escapeHtml(String(r.partySize || "?"))}名</div>
              <div class="hint">${escapeHtml(r.phone || "")}</div>
              ${r.memo ? `<div class="hint">${escapeHtml(r.memo)}</div>` : ""}
              ${r.staffName ? `<div class="hint">担当: ${escapeHtml(r.staffName)}</div>` : ""}
              <div class="action-row">
                ${r.status === "pending" ? `<button type="button" class="btn btn-primary" data-res-confirm="${r.id}">承認する</button>` : ""}
                ${r.status !== "cancelled" ? `<button type="button" class="btn btn-danger" data-res-cancel="${r.id}">キャンセル</button>` : ""}
              </div>
            </li>
          `).join("")}
        </ul>
      ` : `<p class="hint">この日の予約はありません。</p>`}
    `;
  }

  function bindReservationsTab(root) {
    const $prev = root.querySelector("#calPrevMonth");
    const $next = root.querySelector("#calNextMonth");
    if ($prev) $prev.addEventListener("click", () => { state.resTabMonth = addMonths(state.resTabMonth, -1); render(); });
    if ($next) $next.addEventListener("click", () => { state.resTabMonth = addMonths(state.resTabMonth, 1); render(); });
    root.querySelectorAll(".cal-cell[data-date]").forEach((btn) => {
      btn.addEventListener("click", () => { state.resTabDate = btn.dataset.date; state.resTabAdding = false; render(); });
    });

    const $addOpen = root.querySelector("#resAddOpen");
    if ($addOpen) $addOpen.addEventListener("click", () => { state.resTabAdding = true; render(); });
    const $addCancel = root.querySelector("#resAddCancel");
    if ($addCancel) $addCancel.addEventListener("click", () => { state.resTabAdding = false; render(); });

    const $addForm = root.querySelector("#resAddForm");
    if ($addForm) {
      $addForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!state.db) { showToast("通信環境をご確認のうえ、もう一度お試しください。"); return; }
        const fd = new FormData($addForm);
        const time = (fd.get("time") || "").toString();
        const partySize = Number(fd.get("partySize")) || 1;
        const name = (fd.get("name") || "").toString().trim();
        const phone = (fd.get("phone") || "").toString().trim();
        const memo = (fd.get("memo") || "").toString().trim();
        const staffName = (fd.get("staffName") || "").toString().trim();
        if (!name) { showToast("お名前を入力してください"); return; }
        const submitBtn = $addForm.querySelector("button[type=submit]");
        submitBtn.disabled = true;
        submitBtn.textContent = "登録中…";
        try {
          await withAuthRetry(() => state.db.collection("reservations").add({
            date: state.resTabDate,
            time,
            partySize,
            name,
            phone,
            memo,
            staffName,
            status: "confirmed",
            createdAt: new Date().toISOString(),
          }));
          state.resTabAdding = false;
          showToast("予約を登録しました");
          render();
        } catch (err) {
          showToast("登録に失敗しました。もう一度お試しください。" + (err && err.message ? "(" + err.message + ")" : ""));
          submitBtn.disabled = false;
          submitBtn.textContent = "予約を登録する";
        }
      });
    }

    root.querySelectorAll("[data-res-confirm]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await withAuthRetry(() => state.db.collection("reservations").doc(btn.dataset.resConfirm).update({ status: "confirmed" }));
          showToast("予約を確定しました");
        } catch (err) {
          showToast("更新に失敗しました。もう一度お試しください。");
          btn.disabled = false;
        }
      });
    });
    root.querySelectorAll("[data-res-cancel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        try {
          await withAuthRetry(() => state.db.collection("reservations").doc(btn.dataset.resCancel).update({ status: "cancelled" }));
          showToast("予約をキャンセルにしました");
        } catch (err) {
          showToast("更新に失敗しました。もう一度お試しください。");
          btn.disabled = false;
        }
      });
    });
  }

  function bindRegisterTab(root) {
    const reg = state.register;

    // ---- 飲み放題/単品の切り替え(タブタップ + 横スワイプ両対応) ----
    const $swipeWrap = root.querySelector("#regSwipeWrap");
    const $tabBtns = root.querySelectorAll("[data-reg-tab]");
    function setActiveTabClass(view) {
      $tabBtns.forEach((b) => b.classList.toggle("active", b.dataset.regTab === view));
    }
    if ($swipeWrap) {
      // render()のたびにDOMが作り直されscrollLeftが0に戻ってしまうため、
      // 直前にどちらの画面を見ていたか(reg.registerView)に合わせて
      // アニメーションなしで即座にスクロール位置を復元する。
      $swipeWrap.scrollLeft = reg.registerView === "tanpin" ? $swipeWrap.clientWidth : 0;

      $tabBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          const view = btn.dataset.regTab;
          reg.registerView = view;
          setActiveTabClass(view);
          $swipeWrap.scrollTo({ left: view === "tanpin" ? $swipeWrap.clientWidth : 0, behavior: "smooth" });
        });
      });

      // 指でスワイプして切り替えた場合も、次のrender()で同じ画面を保てるよう
      // 現在表示中のページをreg.registerViewに反映しておく(軽いデバウンス付き)。
      let scrollSettleTimer = null;
      $swipeWrap.addEventListener("scroll", () => {
        if (scrollSettleTimer) clearTimeout(scrollSettleTimer);
        scrollSettleTimer = setTimeout(() => {
          const idx = Math.round($swipeWrap.scrollLeft / Math.max(1, $swipeWrap.clientWidth));
          const view = idx > 0 ? "tanpin" : "course";
          reg.registerView = view;
          setActiveTabClass(view);
        }, 120);
      });
    }

    root.querySelectorAll("[data-course-plus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.coursePlus;
        reg.course[key] = (reg.course[key] || 0) + 1;
        render();
      });
    });
    root.querySelectorAll("[data-course-minus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.courseMinus;
        reg.course[key] = Math.max(0, (reg.course[key] || 0) - 1);
        render();
      });
    });

    const $tanpinMinus = root.querySelector("#tanpinMinus");
    const $tanpinPlus = root.querySelector("#tanpinPlus");
    if ($tanpinMinus) $tanpinMinus.addEventListener("click", () => { reg.tanpinCount = Math.max(0, reg.tanpinCount - 1); render(); });
    if ($tanpinPlus) $tanpinPlus.addEventListener("click", () => { reg.tanpinCount += 1; render(); });

    const $extMinus = root.querySelector("#extMinus");
    const $extPlus = root.querySelector("#extPlus");
    if ($extMinus) $extMinus.addEventListener("click", () => { reg.extensions = Math.max(0, reg.extensions - 1); render(); });
    if ($extPlus) $extPlus.addEventListener("click", () => { reg.extensions += 1; render(); });

    root.querySelectorAll("[data-menu-plus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.menuPlus;
        reg.menu[key] = (reg.menu[key] || 0) + 1;
        render();
      });
    });
    root.querySelectorAll("[data-menu-minus]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.menuMinus;
        reg.menu[key] = Math.max(0, (reg.menu[key] || 0) - 1);
        render();
      });
    });

    const $customAdd = root.querySelector("#regCustomAdd");
    if ($customAdd) {
      $customAdd.addEventListener("click", () => {
        const $label = root.querySelector("#regCustomLabel");
        const $amount = root.querySelector("#regCustomAmount");
        const amount = Number($amount.value);
        if (!amount || amount <= 0) { showToast("金額を入力してください"); return; }
        reg.customItems.push({ label: ($label.value || "").trim(), amount });
        render();
      });
    }
    root.querySelectorAll("[data-custom-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        reg.customItems.splice(Number(btn.dataset.customRemove), 1);
        render();
      });
    });

    // 会員を会計対象に追加する共通処理(QRスキャン・写真・検索のどこから追加
    // しても同じ扱いにする)。同じ会員を重複して追加しないようにする。
    function addMemberToRegister(member) {
      if (!member) return false;
      if (reg.members.some((mm) => mm.id === member.id)) {
        showToast(`${member.name || "会員"}さんは既に追加されています`);
        return false;
      }
      reg.members.push({ id: member.id, label: member.name || "名前未設定" });
      reg.memberQuery = "";
      return true;
    }

    const $guestBtn = root.querySelector("#regGuestBtn");
    if ($guestBtn) $guestBtn.addEventListener("click", () => { reg.guest = true; render(); });
    const $guestClear = root.querySelector("#regGuestClear");
    if ($guestClear) $guestClear.addEventListener("click", () => { reg.guest = false; render(); });
    root.querySelectorAll("[data-member-remove]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.memberRemove;
        reg.members = reg.members.filter((mm) => mm.id !== id);
        render();
      });
    });

    const $qrBtn = root.querySelector("#regQrBtn");
    const $qrFile = root.querySelector("#regQrFile");
    if ($qrBtn && $qrFile) {
      $qrBtn.addEventListener("click", () => {
        openLiveQrScanner(
          (member) => {
            if (addMemberToRegister(member)) showToast(`${member.name || "会員"}さんを読み取りました`);
            render();
          },
          (reason) => {
            const msg = reason === "denied"
              ? "このサイトのカメラ利用が許可されていません。端末の設定でカメラを許可すると、かざすだけで読み取れるようになります。今回は写真を1枚撮って読み取ります。"
              : reason === "nocamera"
                ? "カメラが見つかりませんでした。写真を1枚撮って読み取ります。"
                : "カメラでの自動読み取りが使えないため、写真を1枚撮って読み取ります。";
            showToast(msg);
            $qrFile.click();
          },
          () => {
            showToast("手入力で検索してください");
            const $memberSearchManual = root.querySelector("#regMemberSearch");
            if ($memberSearchManual) $memberSearchManual.focus();
          }
        );
      });
      $qrFile.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        decodeMemberQrFile(file, (member) => {
          $qrFile.value = "";
          if (member) {
            if (addMemberToRegister(member)) showToast(`${member.name || "会員"}さんを読み取りました`);
            render();
          } else {
            // 写真1枚方式はやり直しのハードルが高いと諦められやすいため、
            // トーストだけでなく「もう1回撮る」をその場で選べるようにする。
            showToast("QRコードを認識できませんでした。QRが大きく・明るく写るように、もう一度撮ってみてください。");
            const $memberSearchRetry = root.querySelector("#regMemberSearch");
            if ($memberSearchRetry) $memberSearchRetry.focus();
          }
        });
      });
    }

    const $memberSearch = root.querySelector("#regMemberSearch");
    const $memberResults = root.querySelector("#regMemberResults");
    if ($memberSearch) {
      // 会計画面はコースの人数ボタンなど他の操作でも頻繁にrender()が
      // 呼ばれる(=この関数が呼ばれ直す)。以前はrender()のたびに無条件で
      // この検索欄へフォーカスを戻していたため、人数の＋－を押すだけで
      // スマホのキーボードが毎回ポップアップしてしまっていた。
      // 「直前にこの検索欄を実際に触っていたか」をreg側に保持しておき、
      // そのときだけフォーカス・カーソル位置を復元する。
      $memberSearch.addEventListener("focus", () => { reg.memberSearchFocused = true; });
      $memberSearch.addEventListener("blur", () => { reg.memberSearchFocused = false; });
      $memberSearch.addEventListener("input", (e) => {
        reg.memberQuery = e.target.value;
        const q = reg.memberQuery.trim().toLowerCase();
        if (!q) { $memberResults.hidden = true; $memberResults.innerHTML = ""; return; }
        const allMatches = state.members.filter((m) =>
          (m.name || "").toLowerCase().includes(q) || normalizePhone(m.phone).includes(normalizePhone(q))
        );
        const matches = allMatches.slice(0, 30);
        if (!matches.length) {
          $memberResults.innerHTML = `<div class="rr-empty">該当する会員が見つかりません</div>`;
        } else {
          $memberResults.innerHTML = matches.map((m) => `
            <div class="rr-item" data-id="${m.id}">
              <span>${escapeHtml(m.name || "名前未設定")}</span>
              <span class="rr-sub">${escapeHtml(m.phone || "")}</span>
            </div>
          `).join("") + (allMatches.length > matches.length
            ? `<div class="rr-more">他に${allMatches.length - matches.length}件あります。続けて入力すると絞り込めます</div>`
            : "");
          $memberResults.querySelectorAll(".rr-item").forEach((el) => {
            el.addEventListener("click", () => {
              const member = state.members.find((x) => x.id === el.dataset.id);
              if (member) addMemberToRegister(member);
              render();
            });
          });
        }
        $memberResults.hidden = false;
      });
      if (reg.memberSearchFocused) {
        const pos = $memberSearch.value.length;
        $memberSearch.focus();
        $memberSearch.setSelectionRange(pos, pos);
      }
    }

    const $staffSelect = root.querySelector("#regStaffSelect");
    if ($staffSelect) {
      $staffSelect.addEventListener("change", (e) => { reg.staffName = e.target.value; });
    }

    const $confirm = root.querySelector("#regConfirm");
    if ($confirm) {
      $confirm.addEventListener("click", async () => {
        $confirm.disabled = true;
        const total = registerTotal(reg);
        const note = registerBreakdownText(reg);
        const authOk = await ensureAnonymousAuth();
        if (!authOk) {
          showToast("認証に失敗しました。電波の良い場所でページを再読み込みしてから、もう一度お試しください。");
          $confirm.disabled = false;
          return;
        }
        if (reg.members.length === 0) {
          // 会員を選ばない(一般客)会計は書き込みが1件だけなので、失敗しても
          // 何も記録されておらず、そのままもう一度試してもらって問題ない。
          try {
            await withAuthRetry(() => state.db.collection("guestSales").add({
              amount: total,
              note,
              date: businessDateStr(),
              createdAt: new Date().toISOString(),
              staffName: reg.staffName || "",
            }));
            showToast(`一般客の会計(¥${total.toLocaleString()})を記録しました`);
            state.register = createEmptyRegister();
            render();
          } catch (err) {
            showToast("記録に失敗しました。もう一度お試しください。" + (err && err.message ? "(" + err.message + ")" : ""));
            $confirm.disabled = false;
          }
          return;
        }

        // 会員が複数人いる場合、合計金額を人数で按分する。按分の基準人数は
        // 「飲み放題/単品で入力した総人数」と「選んだ会員の人数」の大きい方
        // (人数未入力でも選んだ会員の人数では必ず割れるようにするため)。
        try {
          const headcount = (reg.course.male || 0) + (reg.course.female || 0) + (reg.tanpinCount || 0);
          const denom = Math.max(reg.members.length, headcount || reg.members.length);
          const base = Math.floor(total / denom);
          const remainder = total % denom;
          const shares = [];
          for (let i = 0; i < denom; i++) shares.push(base + (i < remainder ? 1 : 0));
          const memberShares = shares.slice(0, reg.members.length);
          const memberTotal = memberShares.reduce((a, b) => a + b, 0);
          const guestPortion = total - memberTotal;
          const isSplit = reg.members.length > 1 || guestPortion > 0;

          // 会員ごとの記録は1人ずつ個別にtry/catchする。以前はループの途中で
          // 1人分の書き込みが失敗すると例外でループ全体が止まり、画面には
          // 「失敗しました」と出るだけで会計画面の内容(選んだ会員・人数)は
          // そのまま残っていた。これだとスタッフが「もう一度お試しください」を
          // 信じてもう一度「会計確定」を押すと、直前に記録が成功していた会員まで
          // 再度記録されてしまい、スタンプ・来店記録が二重になる恐れがあった。
          // そのため、成功した人・失敗した人を個別に把握したうえで、結果に
          // 関わらず会計画面を必ずリセットし、失敗した分は「＋来店」から
          // 手動で追記してもらう案内を出す(二重記録より、記録漏れを1件
          // 分かりやすく知らせる方が安全なため)。
          const names = [];
          const failedNames = [];
          for (let i = 0; i < reg.members.length; i++) {
            const member = state.members.find((x) => x.id === reg.members[i].id);
            if (!member) continue;
            const splitNote = isSplit ? `${note}(${reg.members.length}名で按分・1人分¥${memberShares[i].toLocaleString()})` : note;
            try {
              await withAuthRetry(() => recordVisit(member, memberShares[i], splitNote, reg.staffName));
              names.push(member.name || "会員");
            } catch (err) {
              failedNames.push(member.name || "会員");
            }
          }
          let guestPortionFailed = false;
          if (guestPortion > 0) {
            try {
              await withAuthRetry(() => state.db.collection("guestSales").add({
                amount: guestPortion,
                note: `${note}(会員${reg.members.length}名以外の按分分)`,
                date: businessDateStr(),
                createdAt: new Date().toISOString(),
                staffName: reg.staffName || "",
              }));
            } catch (err) {
              guestPortionFailed = true;
            }
          }

          if (names.length) {
            showToast(`${names.join("・")}さんの会計(合計¥${total.toLocaleString()})を記録しました`);
          }
          if (failedNames.length || guestPortionFailed) {
            const parts = [];
            if (failedNames.length) parts.push(`${failedNames.join("・")}さん`);
            if (guestPortionFailed) parts.push("会員以外の分");
            setTimeout(() => {
              showToast(`⚠️ ${parts.join("・")}の記録に失敗しました。会員詳細の「＋来店」から金額を入力して追加記録してください。`);
            }, names.length ? 2000 : 0);
          }
          // 成功・失敗に関わらず会計画面は必ずリセットする(二重記録を防ぐため)
          state.register = createEmptyRegister();
          render();
        } catch (err) {
          // ここに来るのは按分計算など書き込み以前の想定外のエラーのみ
          // (まだ何も記録されていないため、会計画面を残したままリトライ可能にする)
          showToast("会計処理中にエラーが発生しました。もう一度お試しください。" + (err && err.message ? "(" + err.message + ")" : ""));
          $confirm.disabled = false;
        }
      });
    }
  }

  // ---------- 本人確認書類(免許証・学生証・保険証など)の画像を圧縮して保存用に変換 ----------
  const ID_DOC_TYPE_LABELS = { license: "運転免許証", student: "学生証", insurance: "保険証", other: "その他の書類" };
  function idDocTypeLabel(type) { return ID_DOC_TYPE_LABELS[type] || "本人確認書類"; }
  // Firestoreは1ドキュメントあたり1MiBまでという上限があり、本人確認書類の
  // 写真1枚でそれを超えると保存自体が失敗する(「保存に失敗しました」)。
  // 背景が写り込んだ写真(机の上に置いて撮影など)は同じ解像度でも容量が
  // 大きくなりやすいため、1回の圧縮で収まらない場合は画質・解像度を
  // 段階的に落として、安全なサイズに収まるまで再圧縮する。
  const ID_IMAGE_MAX_DATAURL_LEN = 650000; // 約650KB相当。他のフィールド分の余裕を残す
  function compressImageFile(file, maxDim, quality, callback) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        function render(dim, q) {
          const scale = Math.min(1, dim / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          try { return canvas.toDataURL("image/jpeg", q); } catch (err) { return null; }
        }
        let dim = maxDim;
        let q = quality;
        let dataUrl = render(dim, q);
        let attempts = 0;
        while (dataUrl && dataUrl.length > ID_IMAGE_MAX_DATAURL_LEN && attempts < 6) {
          q = Math.max(0.3, q - 0.12);
          dim = Math.max(450, Math.round(dim * 0.82));
          dataUrl = render(dim, q);
          attempts++;
        }
        callback(dataUrl);
      };
      img.onerror = () => callback(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => callback(null);
    reader.readAsDataURL(file);
  }

  // QRコードの中身(URLまたは生の文字列)から会員IDを取り出す共通処理。
  // "https://.../#mXXXX" の形式でも、"mXXXX" 単体でも拾えるようにしている。
  function parseMemberIdFromQrText(text) {
    if (!text) return null;
    const m = /#m([a-zA-Z0-9_-]+)/.exec(text) || /^m([a-zA-Z0-9_-]+)$/.exec(text);
    return m ? m[1] : null;
  }

  // 明暗差が小さい(反射・暗所などで)写真でもjsQRが認識しやすくなるよう、
  // 白黒のコントラストを最大まで引き伸ばす。QRの読み取りだけに使う一時処理
  // なので、元の写真(本人確認書類などの保存用画像)には一切使わない。
  function stretchContrastForQr(imageData) {
    const data = imageData.data;
    let min = 255, max = 0;
    for (let i = 0; i < data.length; i += 4) {
      const v = (data[i] + data[i + 1] + data[i + 2]) / 3;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    const range = Math.max(1, max - min);
    for (let i = 0; i < data.length; i += 4) {
      const v = (data[i] + data[i + 1] + data[i + 2]) / 3;
      const nv = Math.min(255, Math.max(0, Math.round(((v - min) / range) * 255)));
      data[i] = data[i + 1] = data[i + 2] = nv;
    }
    return imageData;
  }

  // ---------- ブラウザ内蔵のバーコード検出(対応端末のみ)。jsQRより実写真に強いため優先して試す ----------
  let barcodeDetectorQrSupported = null; // null=未確認, true/false=確認済み
  async function detectQrWithBarcodeDetector(canvas) {
    if (!("BarcodeDetector" in window)) return null;
    try {
      if (barcodeDetectorQrSupported === null) {
        const formats = await window.BarcodeDetector.getSupportedFormats();
        barcodeDetectorQrSupported = formats.includes("qr_code");
      }
      if (!barcodeDetectorQrSupported) return null;
      const detector = new window.BarcodeDetector({ formats: ["qr_code"] });
      const results = await detector.detect(canvas);
      return results && results.length ? results[0].rawValue : null;
    } catch (err) {
      return null;
    }
  }

  // ---------- 会員証QRの画像を読み取って会員を特定する(写真1枚方式。フォールバック用) ----------
  // リアルタイムスキャン(openLiveQrScanner)が使えない端末(LINEのアプリ内ブラウザ等、
  // カメラの連続映像を取得できない環境)向け。写真1枚しか試せないため、
  // 複数の方式・複数の切り抜き方でできる限り認識率を上げている。
  // 1. 対応端末ではブラウザ内蔵のBarcodeDetector(実写真に強い)をまず試す
  // 2. 元解像度に近いサイズでjsQR
  // 3. 明暗差を最大まで引き伸ばした版でjsQR(反射・暗所向け)
  // 4. 中央を切り抜いて拡大した版でjsQR(QRが写真の隅に小さく写っている場合向け)
  function decodeMemberQrFile(file, callback) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = async () => {
        const maxDim = 2200;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let rawText = await detectQrWithBarcodeDetector(canvas);

        if (!rawText) {
          try {
            const qrOpts = { inversionAttempts: "attemptBoth" };
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let code = window.jsQR ? window.jsQR(imageData.data, imageData.width, imageData.height, qrOpts) : null;
            if (!code) {
              const enhanced = stretchContrastForQr(ctx.getImageData(0, 0, canvas.width, canvas.height));
              code = window.jsQR ? window.jsQR(enhanced.data, enhanced.width, enhanced.height, qrOpts) : null;
            }
            if (!code) {
              // 遠すぎ/寄りすぎで写真全体にQRが収まっていない場合向けに、
              // 中央を切り抜いて拡大したものでももう一度だけ試す。
              const cx = canvas.width / 2, cy = canvas.height / 2;
              const cropSize = Math.round(Math.min(canvas.width, canvas.height) * 0.6);
              const cropCanvas = document.createElement("canvas");
              cropCanvas.width = cropSize;
              cropCanvas.height = cropSize;
              const cropCtx = cropCanvas.getContext("2d");
              cropCtx.drawImage(canvas, cx - cropSize / 2, cy - cropSize / 2, cropSize, cropSize, 0, 0, cropSize, cropSize);
              const croppedData = cropCtx.getImageData(0, 0, cropSize, cropSize);
              code = window.jsQR ? window.jsQR(croppedData.data, croppedData.width, croppedData.height, qrOpts) : null;
            }
            if (code && code.data) rawText = code.data;
          } catch (err) { /* 下のcallback(null)に委ねる */ }
        }

        if (!rawText) { callback(null); return; }
        const id = parseMemberIdFromQrText(rawText);
        const member = id ? state.members.find((x) => x.id === id) : null;
        callback(member || null);
      };
      img.onerror = () => callback(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => callback(null);
    reader.readAsDataURL(file);
  }

  // ---------- 会員証QRをカメラにかざして自動で読み取る(リアルタイムスキャン) ----------
  // 「写真を1枚撮ってから解析する」方式だと、暗い店内で別のスマホの画面に
  // 表示されたQRを撮影する場合などに反射・ピンボケで失敗しやすい。
  // 映像を継続的に解析し続けて自動認識する方式にすることで、角度や距離を
  // その場で微調整しながら読み取れるようにしている。
  // カメラが使えない端末(権限なし・非対応ブラウザなど)では、従来の
  // 「写真を1枚撮る」方式に自動でフォールバックする。
  let qrScannerStream = null;
  let qrScannerRAF = null;
  // getUserMedia()の許可待ち中にシートを閉じられるケースに対応するための
  // 世代カウンタ。stopQrScanner()を呼ぶたびに値を進め、各openLiveQrScanner()
  // 呼び出し開始時点のトークンと比較することで、「閉じた後に許可が出て
  // カメラが宙に浮いたまま動き続ける」という競合状態を防ぐ。
  let qrScannerToken = 0;
  function stopQrScanner() {
    qrScannerToken++;
    if (qrScannerRAF) { cancelAnimationFrame(qrScannerRAF); qrScannerRAF = null; }
    if (qrScannerStream) {
      qrScannerStream.getTracks().forEach((t) => t.stop());
      qrScannerStream = null;
    }
  }
  // onManualEntry: 「手入力で検索する」ボタン用のコールバック(省略可)。
  // カメラが許可待ちのまま固まる・権限ダイアログが出ない等、onUnavailableすら
  // 呼ばれない端末があるため、待たずにいつでも手入力へ逃げられるボタンを
  // スキャン画面自体に常時出しておく(「読み取れない時は手入力で」の対応)。
  function openLiveQrScanner(onFound, onUnavailable, onManualEntry) {
    const myToken = ++qrScannerToken;
    const html = `
      <div class="sheet-header">
        <h2>会員証QRを読み取る</h2>
        <button class="sheet-close" id="closeQrScan" aria-label="閉じる">×</button>
      </div>
      <div class="qr-scan-wrap">
        <video id="qrScanVideo" playsinline autoplay muted></video>
        <div class="qr-scan-frame"></div>
      </div>
      <p class="hint" id="qrScanHint">お客様の会員証QRにカメラをかざしてください。自動で読み取ります。</p>
      <button type="button" class="btn btn-ghost" id="qrScanManualBtn" style="width:100%;margin-top:4px;">🔎 読み取れない場合は手入力で検索する</button>
    `;
    openSheet(html);
    const $video = document.getElementById("qrScanVideo");
    const $hint = document.getElementById("qrScanHint");
    document.getElementById("closeQrScan").addEventListener("click", closeSheet);
    const $manualBtn = document.getElementById("qrScanManualBtn");
    if ($manualBtn) {
      $manualBtn.addEventListener("click", () => {
        stopQrScanner();
        closeSheet();
        if (onManualEntry) onManualEntry();
      });
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.jsQR) {
      closeSheet();
      if (onUnavailable) onUnavailable("unsupported");
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then((stream) => {
        if (myToken !== qrScannerToken) {
          // 許可が出るまでの間にシートが閉じられた(別のスキャンが始まった等)。
          // 宙に浮いたストリームを即座に停止して捨てる。
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        qrScannerStream = stream;
        $video.srcObject = stream;
        $video.play().catch(() => {});
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        const tick = () => {
          if (myToken !== qrScannerToken) return; // 既に停止済み
          if ($video.readyState === $video.HAVE_ENOUGH_DATA) {
            canvas.width = $video.videoWidth;
            canvas.height = $video.videoHeight;
            ctx.drawImage($video, 0, 0, canvas.width, canvas.height);
            let code = null;
            try {
              const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
              code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
            } catch (err) { code = null; }
            if (code && code.data) {
              const id = parseMemberIdFromQrText(code.data);
              const member = id ? state.members.find((x) => x.id === id) : null;
              if (member) {
                stopQrScanner();
                closeSheet();
                onFound(member);
                return;
              } else if ($hint) {
                $hint.textContent = "読み取れましたが、該当する会員が見つかりませんでした。もう一度かざしてください。";
              }
            }
          }
          qrScannerRAF = requestAnimationFrame(tick);
        };
        qrScannerRAF = requestAnimationFrame(tick);
      })
      .catch((err) => {
        if (myToken !== qrScannerToken) return; // 既に無効化された呼び出し
        closeSheet();
        const reason = err && err.name === "NotAllowedError" ? "denied"
          : err && err.name === "NotFoundError" ? "nocamera"
          : "error";
        if (onUnavailable) onUnavailable(reason);
      });
  }

  async function recordVisit(m, amount, note, staffName) {
    const wasFirstVisit = (m.visitCount || 0) === 0;
    const dateStr = businessDateStr();
    // ts: ランクの失効判定(直近の来店からの経過日数)を日付文字列の解析に
    // 依存せず正確に行うための実時刻。古い記録にはtsが無いため、その場合は
    // date文字列(yyyy/mm/dd)から解析する(lastVisitTsOf参照)。
    const entry = { date: dateStr, amount: amount || 0, ts: Date.now() };
    if (note) entry.note = note;
    const visits = (m.visits || []).concat([entry]).slice(-15);
    const inc = firebase.firestore.FieldValue.increment;
    // visitCount・totalSpend・points は他の端末と同時に更新される可能性があるため、
    // その場の値を読んで+1するのではなく、Firestore 側でアトミックに加算する
    // (increment)。これにより同時会計による記録の欠落を防ぐ。
    await state.db.collection("members").doc(m.id).update({
      visitCount: inc(1),
      totalSpend: inc(amount || 0),
      points: inc(1),
      // totalPointsEarned が未設定の古い会員データは、まずこれまでの points を
      // 引き継いで初期化する(以後はこのフィールドができるので increment で加算される)
      totalPointsEarned: m.totalPointsEarned != null ? inc(1) : lifetimePointsOf(m) + 1,
      visits,
    });

    // member.visits は直近15件しか保存しないため、来店頻度が高い会員ほど
    // 古い記録が売上・分析の集計から漏れてしまう。そこで会計のたびに全件を
    // 別コレクション(visitLog)にも記録し、年別・曜日別などの集計はそちらを使う。
    try {
      await state.db.collection("visitLog").add({
        memberId: m.id,
        memberName: m.name || "名前未設定",
        date: dateStr,
        amount: amount || 0,
        note: note || "",
        createdAt: new Date().toISOString(),
        staffName: staffName || "",
      });
    } catch (err) { /* 集計用の記録なので失敗しても会計自体は継続する */ }

    // 不正防止: ボーナスは「紹介された本人の初来店」が確定した時点でのみ付与する
    // (登録しただけで友達を増やしても紹介者側にはボーナスが入らない)。
    // ここは会計そのものとは別の処理なので、失敗しても会計の成功報告を
    // 妨げないよう、独立した try/catch で囲む。
    if (wasFirstVisit && m.referredBy && !m.referralBonusGranted) {
      try {
        await grantReferralBonus(m);
      } catch (err) { /* 紹介ボーナスの付与に失敗しても、会計自体は既に成功している */ }
    }
  }

  // 「＋来店」を誤って押してしまった場合に、直前の来店記録1件を取り消す。
  // recordVisit() で加算した visitCount・totalSpend・points・totalPointsEarned を
  // 同じ分だけ減算し、visits配列から最後の1件を削除する。
  // 集計用の visitLog コレクションにも同じタイミングで記録を追加しているため、
  // そのメンバーの最新の visitLog も合わせて削除する(失敗しても会員データ側の
  // 取り消しは既に完了しているので、分析集計が多少ズレる程度で済む)。
  async function undoLastVisit(m) {
    const visits = m.visits || [];
    if (!visits.length) return;
    const last = visits[visits.length - 1];
    if (last.note === "特典利用") return; // 特典利用の取り消しは対象外
    const newVisits = visits.slice(0, -1);
    const dec = firebase.firestore.FieldValue.increment;
    await state.db.collection("members").doc(m.id).update({
      visitCount: dec(-1),
      totalSpend: dec(-(last.amount || 0)),
      points: dec(-1),
      totalPointsEarned: dec(-1),
      visits: newVisits,
    });
    try {
      const snap = await state.db.collection("visitLog")
        .where("memberId", "==", m.id)
        .orderBy("createdAt", "desc")
        .limit(1)
        .get();
      if (!snap.empty) await snap.docs[0].ref.delete();
    } catch (err) { /* 分析集計用の記録なので、削除に失敗しても取り消し自体は成功している */ }
  }

  // ---------- ダーツ対戦成績(簡易) ----------
  // 本格的な対戦記録(相手・スコアなど)までは扱わず、「勝った回数」だけを
  // 会員ごとに記録するシンプルな仕様。オーナー専用アプリの「分析」タブに
  // ランキングとして表示する。
  async function recordDartsWin(m) {
    const inc = firebase.firestore.FieldValue.increment;
    const dateStr = new Date().toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
    await state.db.collection("members").doc(m.id).update({
      dartsWins: inc(1),
      dartsLastWinDate: dateStr,
    });
  }
  async function undoDartsWin(m) {
    if (!(m.dartsWins || 0)) return;
    const dec = firebase.firestore.FieldValue.increment;
    await state.db.collection("members").doc(m.id).update({ dartsWins: dec(-1) });
  }
  function dartsLeaderboard() {
    return state.members
      .map((m) => ({ m, wins: m.dartsWins || 0 }))
      .filter((x) => x.wins > 0)
      .sort((a, b) => b.wins - a.wins)
      .slice(0, 10);
  }

  async function grantReferralBonus(referredMember) {
    const referrerId = referredMember.referredBy && referredMember.referredBy.id;
    const referrer = referrerId ? state.members.find((x) => x.id === referrerId) : null;

    if (!referrer) {
      // 紹介者のデータが見つからない(削除済みなど)場合は処理済みにするだけ
      await state.db.collection("members").doc(referredMember.id).update({ referralBonusGranted: true });
      return;
    }

    // 不正防止: 同じ紹介者が30日間に受け取れるボーナスには上限を設ける
    const now = Date.now();
    const recentLog = (referrer.referralLog || []).filter((e) => now - new Date(e.date).getTime() < REFERRAL_WINDOW_MS);
    const underCap = recentLog.length < REFERRAL_MONTHLY_CAP;

    if (underCap) {
      const newLog = recentLog.concat([{ date: new Date().toISOString(), memberId: referredMember.id, name: referredMember.name || "" }]).slice(-20);
      await state.db.collection("members").doc(referrer.id).update({
        points: firebase.firestore.FieldValue.increment(REFERRAL_BONUS_POINTS),
        totalPointsEarned: referrer.totalPointsEarned != null
          ? firebase.firestore.FieldValue.increment(REFERRAL_BONUS_POINTS)
          : lifetimePointsOf(referrer) + REFERRAL_BONUS_POINTS,
        referralLog: newLog,
      });
      setTimeout(() => showToast(`紹介ボーナス: ${referrer.name || ""}さんに+${REFERRAL_BONUS_POINTS}スタンプ`), 1800);
    } else {
      setTimeout(() => showToast(`${referrer.name || ""}さんは紹介ボーナスの上限(30日に${REFERRAL_MONTHLY_CAP}回)に達しています`), 1800);
    }

    await state.db.collection("members").doc(referredMember.id).update({ referralBonusGranted: true });
  }

  async function redeemReward(m) {
    const dateStr = businessDateStr();
    const visits = (m.visits || []).concat([{ date: dateStr, amount: 0, note: "特典利用", ts: Date.now() }]).slice(-15);
    // 特典利用後の残ポイントは「0固定」ではなく、現在のスタンプ数から
    // REWARD_THRESHOLD分だけ引く(例: 12個溜まっていたら7個残す)。
    // 0固定だと、特典ボタンを押すタイミングによって次回までに貯めたスタンプが
    // 消えてしまうことがあった。
    const remaining = Math.max(0, (m.points || 0) - REWARD_THRESHOLD);
    await state.db.collection("members").doc(m.id).update({ points: remaining, visits });
  }

  // ---------- visitLog バックフィル(既存会員の既存記録を一度だけ移す) ----------
  // この修正より前から使っている会員は、member.visits(直近15件)にしか記録が無い。
  // visitLog(集計用の全件保存)が導入された後、各会員につき一度だけ
  // その時点の member.visits を visitLog にコピーし、以後は recordVisit() が
  // 両方に書き込む。member.visitLogBackfilled フラグで二重実行を防ぐ。
  let backfillRunning = false;
  // この関数は「以前バックフィルが完了していない会員」を対象に、
  // member.visits(直近15件)の内容をvisitLogにも書き写す一度だけの移行処理。
  // 以前は「対象かどうか」をmember側のフラグだけで判定していたため、
  // フラグの保存が(権限エラーや複数端末での同時実行などで)失敗して
  // 何度もやり直されると、すでにリアルタイムでvisitLogに記録済みの
  // 来店が再度書き込まれ、「最近の会計・来店記録」に同じ人が重複して
  // 表示される不具合があった。そこで、書き込む前に必ず
  // 「そのメンバーのvisitLogが本当に1件も無いか」をFirestore側で確認し、
  // 既に何かあれば一切書き込まずフラグだけ立てるようにして、何度実行しても
  // 重複が増えないようにしている。
  async function backfillVisitLogIfNeeded() {
    if (!state.db || !state.ready || !state.visitLogReady || backfillRunning) return;
    const targets = state.members.filter((m) => !m.visitLogBackfilled && (m.visits || []).length);
    if (!targets.length) return;
    backfillRunning = true;
    try {
      for (const m of targets) {
        try {
          const existing = await state.db.collection("visitLog").where("memberId", "==", m.id).limit(1).get();
          if (existing.empty) {
            const writes = (m.visits || []).map((v) =>
              withAuthRetry(() => state.db.collection("visitLog").add({
                memberId: m.id,
                memberName: m.name || "名前未設定",
                date: v.date || "",
                amount: Number(v.amount) || 0,
                note: v.note || "",
                createdAt: "",
                backfilled: true,
              }))
            );
            await Promise.all(writes);
          }
          await withAuthRetry(() => state.db.collection("members").doc(m.id).update({ visitLogBackfilled: true }));
        } catch (err) {
          // この会員のバックフィルだけ失敗しても、他の会員の処理は続ける
          // (フラグが立たなければ次回また対象になるだけで、重複は発生しない)
        }
      }
    } finally {
      backfillRunning = false;
    }
  }

  // ---------- visitLogの重複クリーンアップ(一度だけ実行) ----------
  // 上記の不具合により過去に生まれてしまった重複(backfilled:trueの記録が
  // 同じ内容で複数ある、またはリアルタイム記録と同じ内容のbackfilled:trueの
  // 記録が残っている)を取り除く。安全のため「backfilled:trueの記録」だけを
  // 削除対象にし、通常の会計で記録された本物の来店記録(backfilledが付いて
  // いないもの)は絶対に削除しない。settings/app の visitLogDedupeV1Done
  // フラグで一度だけ実行し、以後は毎回実行しない。
  let dedupeAttempted = false;
  async function dedupeVisitLogBackfillDuplicates() {
    if (dedupeAttempted || !state.db) return;
    dedupeAttempted = true;
    try {
      const appDoc = await state.db.collection("settings").doc("app").get();
      if (appDoc.exists && appDoc.data() && appDoc.data().visitLogDedupeV1Done) return;

      const snap = await state.db.collection("visitLog").get();
      const groups = {};
      snap.docs.forEach((d) => {
        const data = d.data();
        const key = [data.memberId || "", data.date || "", Number(data.amount) || 0, data.note || ""].join("|");
        if (!groups[key]) groups[key] = [];
        groups[key].push({ id: d.id, backfilled: !!data.backfilled });
      });

      const toDelete = [];
      Object.values(groups).forEach((group) => {
        if (group.length < 2) return;
        const hasReal = group.some((g) => !g.backfilled);
        if (hasReal) {
          // 本物の記録があるグループ: backfilled側を全て重複として削除
          group.filter((g) => g.backfilled).forEach((g) => toDelete.push(g.id));
        } else {
          // 全てbackfilled(=古いバックフィルが複数回行われた)グループ:
          // 1件だけ残し、残りを削除
          group.slice(1).forEach((g) => toDelete.push(g.id));
        }
      });

      // Firestoreのバッチは1回500件までのため、450件ずつに分けて削除する
      for (let i = 0; i < toDelete.length; i += 450) {
        const batch = state.db.batch();
        toDelete.slice(i, i + 450).forEach((id) => batch.delete(state.db.collection("visitLog").doc(id)));
        await withAuthRetry(() => batch.commit());
      }

      await withAuthRetry(() => state.db.collection("settings").doc("app").set({ visitLogDedupeV1Done: true }, { merge: true }));
      if (toDelete.length) {
        showToast(`来店記録の重複${toDelete.length}件を整理しました`);
      }
    } catch (err) {
      // 失敗しても通常機能には影響しない。次回のページ読み込みで再試行される。
      dedupeAttempted = false;
    }
  }

  // ---------- boot ----------
  async function boot() {
    state.unlocked = readStoredUnlock();
    if (state.unlocked) state.tab = "list";
    applyLockUI();
    render();

    // ---- 来店確認ページ(#checkin)はFirestoreへの読み書きが一切不要 ----
    // ここでFirebaseへ接続しないことで、来店者の端末に会員・スタッフ・
    // 売上などのデータが一切読み込まれないようにする(不要な個人情報の
    // ダウンロードを避けるため)。
    if (state.publicCheckinMode) {
      state.ready = true;
      render();
      return;
    }

    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (err) {
      db = null;
    }
    if (!db) {
      $main.innerHTML = `<div class="empty"><div class="glyph">${emptyIcon()}</div><p>データ保存機能を利用できません。</p><p>通信環境をご確認のうえ、ページを再読み込みしてください。</p></div>`;
      return;
    }
    // ---- 匿名認証(第三者がFirestoreへ直接アクセスするのを防ぐため) ----
    // 電波が弱い環境などで最初のサインインが失敗しても、ensureAnonymousAuth()が
    // 数回リトライする。それでも失敗した場合は閲覧(キャッシュ)はできても
    // 保存ができない状態になるため、保存系の操作の直前にも毎回呼び直す。
    await ensureAnonymousAuth();
    state.db = db;

    // ---- 画面がロック・バックグラウンドから復帰した時の再接続対策 ----
    // iPhoneなどで長時間アプリを閉じたり画面をロックしたままにしていると、
    // Firestoreのリアルタイム同期(onSnapshot)が止まったまま再接続されず、
    // 「他のスタッフ・お客様が新しく登録した会員が検索に出てこない」状態に
    // なることがある(アプリ側の不具合ではなく、スマホのブラウザが通信を
    // 一時停止する挙動によるもの)。画面に戻ってきたタイミングで明示的に
    // ネットワークを繋ぎ直すことで、データを最新の状態に復帰させる。
    if (!state.networkResumeBound) {
      state.networkResumeBound = true;
      const resumeSync = () => {
        if (!state.db) return;
        state.db.disableNetwork().catch(() => {}).then(() => state.db.enableNetwork().catch(() => {}));
      };
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") resumeSync(); });
      window.addEventListener("pageshow", resumeSync);
      window.addEventListener("online", resumeSync);
    }

    // ---- アンケート(#feedback)・予約(#reserve)は送信専用ページ ----
    // 送信に必要な書き込み権限だけがあればよく、会員一覧などの読み込みは
    // 不要なため、他のコレクションは一切購読しない。
    if (state.publicFeedbackMode || state.publicReserveMode) {
      state.ready = true;
      render();
      return;
    }

    // ---- 会員証ページ(#card<id>)は「自分の会員証」1件だけが必要 ----
    // 会員全員のデータをまとめて読み込む(bulk)のではなく、該当する
    // 1件だけをその場で取得する。これにより、他のお客様の個人情報
    // (電話番号・本人確認書類の画像など)が端末に読み込まれることはない。
    if (state.publicCardMode) {
      if (state.publicCardMemberId) {
        try {
          const doc = await state.db.collection("members").doc(state.publicCardMemberId).get();
          if (doc.exists) state.publicCardMemberFallback = { id: doc.id, ...doc.data() };
        } catch (err) { /* 取得失敗時は下のreadyフラグのみ立てて「見つかりません」表示にする */ }
      }
      state.ready = true;
      render();
      return;
    }

    state.db.collection("members").orderBy("name", "asc").onSnapshot(
      (snap) => {
        state.members = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.ready = true;
        render();
        tryApplyMemberEntry();
        if (!state.publicJoinMode) backfillVisitLogIfNeeded();
      },
      () => { state.ready = true; showToast("データの読み込みでエラーが発生しました"); render(); }
    );

    // ---- 新規会員登録ページ(#join)はここまでで必要な機能が揃っている ----
    // (紹介者検索・簡易重複チェックのため会員一覧の読み込みは必要だが、
    // 売上・予約・スタッフ名簿・各種PINなど、登録とは無関係な情報は
    // 来店者の端末に一切読み込まない)
    if (state.publicJoinMode) return;
    state.db.collection("guestSales").onSnapshot(
      (snap) => {
        state.guestSales = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.guestSalesReady = true;
        render();
      },
      () => { state.guestSalesReady = true; render(); }
    );
    // 会員の来店記録は member.visits に直近15件のみ保存しているため、
    // 来店頻度が高い会員ほど古い記録が集計から漏れてしまう。
    // そのため全件を別コレクションにも記録し、売上・分析タブの集計はここから行う。
    // お客様アンケート(#feedback で送信された、ご意見・感想・満足度)。
    // 新しい順に最大50件まで、オーナー専用アプリの「お客様の声」に表示する。
    state.db.collection("feedback").orderBy("createdAt", "desc").limit(50).onSnapshot(
      (snap) => {
        state.feedback = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.feedbackReady = true;
        render();
      },
      () => { state.feedbackReady = true; render(); }
    );
    // 予約(#reserve の公開フォームから送信されたもの)。orderByを付けず全件を
    // 購読し、カレンダー表示側で日付ごとに絞り込む(予約数が多くなりすぎない
    // 小規模店舗の運用を想定)。
    state.db.collection("reservations").onSnapshot(
      (snap) => {
        state.reservations = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.reservationsReady = true;
        render();
      },
      () => { state.reservationsReady = true; render(); }
    );
    // スタッフ一覧(在籍記録。オーナー専用コード画面内に表示)
    // Firestoreのルールが一時的に古い状態だった場合などに一度エラーになると、
    // onSnapshot はそのまま停止してしまい、後でルールを直してもページを
    // 再読み込みするまで一覧が復活しない。それを避けるため、エラー時は
    // 少し待って自動的に購読し直す。
    function subscribeStaffList() {
      state.db.collection("staff").orderBy("createdAt", "asc").onSnapshot(
        (snap) => {
          state.staffList = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          state.staffListReady = true;
          if (state.staffSheetOpen) renderStaffListIntoSheet();
        },
        () => {
          state.staffListReady = true;
          setTimeout(subscribeStaffList, 5000);
        }
      );
    }
    subscribeStaffList();
    state.db.collection("visitLog").onSnapshot(
      (snap) => {
        state.visitLog = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.visitLogReady = true;
        render();
        backfillVisitLogIfNeeded();
        dedupeVisitLogBackfillDuplicates();
      },
      () => { state.visitLogReady = true; render(); }
    );
    // スタッフの出勤・退勤記録(勤怠)。直近500件まで新しい順に購読し、
    // 「現在の状態(出勤中かどうか)」は各スタッフの最新1件から判定する。
    state.db.collection("attendance").orderBy("ts", "desc").limit(500).onSnapshot(
      (snap) => {
        state.attendance = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.attendanceReady = true;
        render();
      },
      () => { state.attendanceReady = true; render(); }
    );
    state.db.collection("settings").doc("staffAccess").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        if (data && data.code) {
          state.staffCode = String(data.code);
        } else if (!state.staffGateChecked) {
          // まだコードが無ければ初回に自動で発行する
          const code = String(Math.floor(1000 + Math.random() * 9000));
          state.db.collection("settings").doc("staffAccess").set({ code, updatedAt: Date.now() }).catch(() => {});
        }
        state.staffGateChecked = true;
        evaluateStaffAccess();
      },
      () => { state.staffGateChecked = true; evaluateStaffAccess(); }
    );
    state.db.collection("settings").doc("pricing").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        CUSTOM_MENU_ITEMS = (data && Array.isArray(data.customMenu))
          ? data.customMenu.map((it) => ({ key: it.key, label: it.label, price: Number(it.price) || 0 }))
          : CUSTOM_MENU_ITEMS;
        rebuildMenuAggregates();
        // Number(data[it.key]) が NaN になる値(空文字や不正な文字列など)が
        // Firestore に保存されていた場合、!= null チェックだけでは素通りして
        // 料金が NaN になり、以降の合計金額計算が全て NaN になってしまう。
        // Number.isFinite() で確実な数値だけを使い、それ以外は初期値に戻す。
        COURSES.concat(GAME_ITEMS).concat(BASE_MENU_ITEMS).forEach((it) => {
          const n = data ? Number(data[it.key]) : NaN;
          it.price = Number.isFinite(n) ? n : DEFAULT_PRICES[it.key];
        });
        const extN = data ? Number(data.extension) : NaN;
        EXTENSION_PRICE = Number.isFinite(extN) ? extN : DEFAULT_PRICES.extension;
        const tanN = data ? Number(data.tanpin) : NaN;
        TANPIN_CHARGE = Number.isFinite(tanN) ? tanN : DEFAULT_PRICES.tanpin;
        render();
      },
      () => {}
    );
    // ---- オーナーPIN(settings/app ドキュメント。無ければ初期値 "6188" を自動発行) ----
    state.db.collection("settings").doc("app").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        if (data && data.ownerPin) {
          OWNER_PIN = String(data.ownerPin);
        } else {
          state.db.collection("settings").doc("app").set({ ownerPin: OWNER_PIN, updatedAt: Date.now() }, { merge: true }).catch(() => {});
        }
      },
      () => {}
    );
  }

  boot();
})();
</script>
</body>
</html>
