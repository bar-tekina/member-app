            <input type="number" id="e-bday" name="birthDay" min="1" max="31" value="${m.birthDay || ""}">
          </label>
        </div>
        <label class="field">メモ
          <textarea id="e-memo" name="memo" rows="2">${escapeHtml(m.memo || "")}</textarea>
        </label>

        <label class="field">本人確認書類(任意・年齢確認用)
          <select id="e-id-type">
            <option value="">書類の種類を選択</option>
            <option value="license" ${existingDoc && existingDoc.type === "license" ? "selected" : ""}>運転免許証</option>
            <option value="student" ${existingDoc && existingDoc.type === "student" ? "selected" : ""}>学生証</option>
            <option value="insurance" ${existingDoc && existingDoc.type === "insurance" ? "selected" : ""}>保険証</option>
            <option value="other" ${existingDoc && existingDoc.type === "other" ? "selected" : ""}>その他</option>
          </select>
        </label>
        <div id="e-id-preview-wrap" ${existingDoc && existingDoc.image ? "" : "hidden"}>
          <img id="e-id-preview" src="${existingDoc && existingDoc.image ? existingDoc.image : ""}" alt="本人確認書類プレビュー" style="max-width:160px;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:8px;">
        </div>
        <input type="file" accept="image/*" capture="environment" id="e-id-file" style="display:none">
        <div class="reg-custom-row">
          <button type="button" class="btn btn-ghost" id="e-id-capture" style="flex:1;">📷 ${existingDoc && existingDoc.image ? "撮り直す" : "書類を撮影する"}</button>
          <button type="button" class="btn btn-ghost" id="e-id-clear" ${existingDoc && existingDoc.image ? "" : "hidden"} style="flex:none;">削除</button>
        </div>
        <p class="hint">免許証・学生証・保険証などを撮影して、年齢・氏名確認用に保存できます(任意)。画像はこのアプリ内にのみ保存されます。</p>

        <button type="submit" class="btn btn-primary">保存する</button>
      </form>
    `;
    openSheet(html);
    document.getElementById("closeEdit").addEventListener("click", closeSheet);

    // ---- 本人確認書類の撮影(編集) ----
    let idDocState = "unchanged"; // "unchanged" | "cleared" | { image }
    const $idType = document.getElementById("e-id-type");
    const $idFile = document.getElementById("e-id-file");
    const $idCapture = document.getElementById("e-id-capture");
    const $idClear = document.getElementById("e-id-clear");
    const $idPreviewWrap = document.getElementById("e-id-preview-wrap");
    const $idPreview = document.getElementById("e-id-preview");
    $idCapture.addEventListener("click", () => $idFile.click());
    $idFile.addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      compressImageFile(file, 1000, 0.7, (dataUrl) => {
        $idFile.value = "";
        if (!dataUrl) { showToast("画像を読み込めませんでした"); return; }
        idDocState = { image: dataUrl };
        $idPreview.src = dataUrl;
        $idPreviewWrap.hidden = false;
        $idClear.hidden = false;
        $idCapture.textContent = "📷 撮り直す";
      });
    });
    $idClear.addEventListener("click", () => {
      idDocState = "cleared";
      $idPreview.src = "";
      $idPreviewWrap.hidden = true;
      $idClear.hidden = true;
      $idCapture.textContent = "📷 書類を撮影する";
    });

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = (fd.get("name") || "").toString().trim();
      if (!name) return;
      const payload = {
        name,
        phone: (fd.get("phone") || "").toString().trim(),
        address: (fd.get("address") || "").toString().trim(),
        birthYear: fd.get("birthYear") ? Number(fd.get("birthYear")) : null,
        birthMonth: fd.get("birthMonth") ? Number(fd.get("birthMonth")) : null,
        birthDay: fd.get("birthDay") ? Number(fd.get("birthDay")) : null,
        memo: (fd.get("memo") || "").toString().trim(),
      };
      if (idDocState === "cleared") {
        payload.idDocument = null;
      } else if (idDocState !== "unchanged") {
        payload.idDocument = { type: $idType.value || "other", image: idDocState.image, uploadedAt: new Date().toISOString() };
      } else if (existingDoc && $idType.value !== (existingDoc.type || "")) {
        payload.idDocument = { ...existingDoc, type: $idType.value || "other" };
      }
      await state.db.collection("members").doc(m.id).update(payload);
      closeSheet();
      showToast("会員情報を更新しました");
    });
  }

  function confirmDelete(m) {
    const html = `
      <div class="sheet-header"><h2>削除しますか？</h2></div>
      <p class="hint">「${escapeHtml(m.name || "")}」さんの会員データを削除します。この操作は取り消せません。</p>
      <div class="action-row">
        <button class="btn btn-ghost" id="cancelDelete">キャンセル</button>
        <button class="btn btn-danger" id="confirmDelete">削除する</button>
      </div>
    `;
    openSheet(html);
    document.getElementById("cancelDelete").addEventListener("click", closeSheet);
    document.getElementById("confirmDelete").addEventListener("click", async () => {
      await state.db.collection("members").doc(m.id).delete();
      closeSheet();
      showToast("削除しました");
    });
  }

  // ---------- visitLog バックフィル(既存会員の既存記録を一度だけ移す) ----------
  // この修正より前から使っている会員は、member.visits(直近15件)にしか記録が無い。
  // visitLog(集計用の全件保存)が導入された後、各会員につき一度だけ
  // その時点の member.visits を visitLog にコピーし、以後は recordVisit() が
  // 両方に書き込む。member.visitLogBackfilled フラグで二重実行を防ぐ。
  let backfillRunning = false;
  async function backfillVisitLogIfNeeded() {
    if (!state.db || !state.ready || !state.visitLogReady || backfillRunning) return;
    const targets = state.members.filter((m) => !m.visitLogBackfilled && (m.visits || []).length);
    if (!targets.length) return;
    backfillRunning = true;
    try {
      for (const m of targets) {
        const writes = (m.visits || []).map((v) =>
          state.db.collection("visitLog").add({
            memberId: m.id,
            memberName: m.name || "名前未設定",
            date: v.date || "",
            amount: Number(v.amount) || 0,
            note: v.note || "",
            createdAt: "",
            backfilled: true,
          })
        );
        await Promise.all(writes);
        await state.db.collection("members").doc(m.id).update({ visitLogBackfilled: true });
      }
    } catch (err) {
      // 集計用のバックフィルなので、失敗しても通常の会計・登録機能には影響しない
    } finally {
      backfillRunning = false;
    }
  }

  // ---------- boot ----------
  async function boot() {
    state.unlocked = readStoredUnlock();
    if (state.unlocked) state.tab = "list";
    applyLockUI();
    render();
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
    } catch (err) {
      db = null;
    }
    if (!db) {
      $main.innerHTML = `<div class="empty"><div class="glyph">${emptyIcon()}</div><p>データ保存機能を利用できません。</p><p>通信環境をご確認のうえ、ページを再読み込みしてください。</p></div>`;
      return;
    }
    state.db = db;
    state.db.collection("members").orderBy("name", "asc").onSnapshot(
      (snap) => {
        state.members = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.ready = true;
        render();
        tryApplyMemberEntry();
        backfillVisitLogIfNeeded();
      },
      () => { state.ready = true; showToast("データの読み込みでエラーが発生しました"); render(); }
    );
    state.db.collection("guestSales").onSnapshot(
      (snap) => {
        state.guestSales = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.guestSalesReady = true;
        render();
      },
      () => { state.guestSalesReady = true; render(); }
    );
    // 会員の来店記録は member.visits に直近15件のみ保存しているため、
    // 来店頻度が高い会員ほど古い記録が集計から漏れてしまう。
    // そのため全件を別コレクションにも記録し、売上・分析タブの集計はここから行う。
    state.db.collection("visitLog").onSnapshot(
      (snap) => {
        state.visitLog = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        state.visitLogReady = true;
        render();
        backfillVisitLogIfNeeded();
      },
      () => { state.visitLogReady = true; render(); }
    );
    state.db.collection("settings").doc("staffAccess").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        if (data && data.code) {
          state.staffCode = String(data.code);
        } else if (!state.staffGateChecked) {
          // まだコードが無ければ初回に自動で発行する
          const code = String(Math.floor(1000 + Math.random() * 9000));
          state.db.collection("settings").doc("staffAccess").set({ code, updatedAt: Date.now() }).catch(() => {});
        }
        state.staffGateChecked = true;
        evaluateStaffAccess();
      },
      () => { state.staffGateChecked = true; evaluateStaffAccess(); }
    );
    state.db.collection("settings").doc("pricing").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        CUSTOM_MENU_ITEMS = (data && Array.isArray(data.customMenu))
          ? data.customMenu.map((it) => ({ key: it.key, label: it.label, price: Number(it.price) || 0 }))
          : CUSTOM_MENU_ITEMS;
        rebuildMenuAggregates();
        COURSES.concat(GAME_ITEMS).concat(BASE_MENU_ITEMS).forEach((it) => {
          it.price = data && data[it.key] != null ? Number(data[it.key]) : DEFAULT_PRICES[it.key];
        });
        EXTENSION_PRICE = data && data.extension != null ? Number(data.extension) : DEFAULT_PRICES.extension;
        TANPIN_CHARGE = data && data.tanpin != null ? Number(data.tanpin) : DEFAULT_PRICES.tanpin;
        render();
      },
      () => {}
    );
    // ---- オーナーPIN(settings/app ドキュメント。無ければ初期値 "6188" を自動発行) ----
    state.db.collection("settings").doc("app").onSnapshot(
      (doc) => {
        const data = doc && doc.exists ? doc.data() : null;
        if (data && data.ownerPin) {
          OWNER_PIN = String(data.ownerPin);
        } else {
          state.db.collection("settings").doc("app").set({ ownerPin: OWNER_PIN, updatedAt: Date.now() }, { merge: true }).catch(() => {});
        }
      },
      () => {}
    );
  }

  boot();
})();
</script>
