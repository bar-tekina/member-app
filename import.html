<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>データ移行ツール - Barてきな？</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; line-height: 1.7; color: #222; }
  h1 { font-size: 20px; }
  button { font-size: 16px; padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #94a3b8; cursor: default; }
  #log { white-space: pre-wrap; background: #f3f4f6; padding: 16px; border-radius: 8px; margin-top: 20px; font-size: 14px; }
  .ok { color: #16a34a; } .ng { color: #dc2626; }
</style>
</head>
<body>
<h1>旧データの移行ツール（1回限り）</h1>
<p>以前のアプリに入っていた会員データと料金設定を、この新しいアプリの Firestore に書き込みます。<br>
下のボタンは<strong>1回だけ</strong>押してください。押した後は、このページ（import.html）は削除して問題ありません。</p>
<button id="runBtn">データを移行する</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBrAsCJCIyv1Ka2ClmkF6ZivX5I8MUZ0lo",
  authDomain: "bar-tekina.firebaseapp.com",
  projectId: "bar-tekina",
  storageBucket: "bar-tekina.firebasestorage.app",
  messagingSenderId: "256271315426",
  appId: "1:256271315426:web:bce7459f7fc4d9241649bb",
};

// 旧アプリ(Claude Artifact版)から取り出した移行データ
const oldMembers = [
  {
    id: "c28fotw1gw19fl75bjwc",
    data: {
      address: "北見市桜町6丁目2-17アパートメント佐竹A号",
      birthDay: 11,
      birthMonth: 4,
      birthYear: 1974,
      createdAt: "2026-10-08T14:31:52.614Z",
      memo: "",
      name: "中崎    靖",
      phone: "09094331486",
      points: 0,
      referralBonusGranted: false,
      referralLog: [],
      referredBy: null,
      totalPointsEarned: 0,
      totalSpend: 0,
      visitCount: 0,
      visits: []
    }
  }
];

const oldPricing = {
  alcohol: 700,
  customMenu: [
    { key: "custom_1791530501018_150", label: "テキーラ", price: 300 },
    { key: "custom_1791530556990_488", label: "シャンパン（モエ白）", price: 18000 },
    { key: "custom_1791530628051_961", label: "オリシャン", price: 3500 }
  ],
  extension: 500,
  female: 2500,
  games: 1500,
  kakigori: 300,
  male: 3000,
  softcream: 400,
  softdrink: 700,
  staffdrink: 700,
  tanpin: 1100,
  updatedAt: 1791530647895
};

const $log = document.getElementById("log");
const $btn = document.getElementById("runBtn");
function log(msg, cls) {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  $log.appendChild(line);
}

$btn.addEventListener("click", async () => {
  $btn.disabled = true;
  log("開始します…");
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    for (const m of oldMembers) {
      await db.collection("members").doc(m.id).set(m.data, { merge: true });
      log(`✓ 会員データを書き込みました: ${m.data.name}`, "ok");
    }

    await db.collection("settings").doc("pricing").set(oldPricing, { merge: true });
    log("✓ 料金設定を書き込みました", "ok");

    log("完了しました。会員ページ（index.html）に戻って確認してください。", "ok");
  } catch (err) {
    log("エラーが発生しました: " + (err && err.message ? err.message : String(err)), "ng");
    $btn.disabled = false;
  }
});
</script>
</body>
</html>
